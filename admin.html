<title>店主后台 · Sam Barbershop</title>
<style>/* ========== 设计变量：参照 iOS 系统配色，自动适配深色模式 ========== */
body {
  --bg: #f2f2f7;
  --card: #ffffff;
  --label: #1c1c1e;
  --secondary: #8e8e93;
  --tertiary: #c7c7cc;
  --separator: rgba(60, 60, 67, 0.12);
  --fill: rgba(120, 120, 128, 0.12);
  --seg-on: #ffffff;
  --primary: #1c1c1e;
  --on-primary: #ffffff;
  --link: #007aff;
  --danger: #ff3b30;
  --success: #34c759;
  --nav-bg: rgba(242, 242, 247, 0.78);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
  /* 品牌色：理发店转灯的红和蓝，只用在标志上 */
  --pole-red: #d0312d;
  --pole-blue: #2b59c3;

  /* Apple 常用的缓动曲线 */
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  background: var(--bg);
  color: var(--label);
  font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body {
    --bg: #000000;
    --card: #1c1c1e;
    --label: #ffffff;
    --secondary: #8e8e93;
    --tertiary: #48484a;
    --separator: rgba(84, 84, 88, 0.6);
    --fill: rgba(120, 120, 128, 0.24);
    --seg-on: #636366;
    --primary: #f5f5f7;
    --on-primary: #000000;
    --link: #0a84ff;
    --danger: #ff453a;
    --success: #30d158;
    --nav-bg: rgba(0, 0, 0, 0.72);
    --shadow: none;
    --pole-red: #ff453a;
    --pole-blue: #409cff;
  } }
:root[data-theme="dark"] body {
    --bg: #000000;
    --card: #1c1c1e;
    --label: #ffffff;
    --secondary: #8e8e93;
    --tertiary: #48484a;
    --separator: rgba(84, 84, 88, 0.6);
    --fill: rgba(120, 120, 128, 0.24);
    --seg-on: #636366;
    --primary: #f5f5f7;
    --on-primary: #000000;
    --link: #0a84ff;
    --danger: #ff453a;
    --success: #30d158;
    --nav-bg: rgba(0, 0, 0, 0.72);
    --shadow: none;
    --pole-red: #ff453a;
    --pole-blue: #409cff;
  }

/* ========== 通用组件 ========== */

/* 分组列表（iOS 设置页那种圆角白卡片） */
.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 24px 24px 7px;
  font-size: 13px;
  color: var(--secondary);
  letter-spacing: 0.25px;
}
.group {
  margin: 0 16px;
  background: var(--card);
  border-radius: 12px;
  overflow: hidden;
}
.row {
  display: flex;
  align-items: center;
  min-height: 48px;
  padding: 10px 16px;
  transition: background-color 200ms var(--ease-out);
}
.row + .row { border-top: 0.5px solid var(--separator); }
.row-pressed { background: var(--fill); }

/* 主按钮：按下时轻微缩小，像 iOS 一样有“按下去”的手感 */
.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 50px;
  padding: 0 24px;
  border-radius: 499.5px;
  background: var(--primary);
  color: var(--on-primary);
  font-size: 16px;
  font-weight: 600;
  transition: transform 250ms var(--ease-out), opacity 250ms var(--ease-out);
}
.btn-pressed { transform: scale(0.96); opacity: 0.85; }
.btn-text {
  text-align: center;
  padding: 14px 0 4px;
  color: var(--link);
  font-size: 15px;
}

/* ========== 分段控件 ========== */
.segmented {
  position: relative;
  display: flex;
  margin: 0 16px;
  padding: 2px;
  border-radius: 11px;
  background: var(--fill);
}
.seg-indicator {
  position: absolute;
  top: 2px;
  bottom: 2px;
  left: 2px;
  border-radius: 9px;
  background: var(--seg-on);
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1), 0 1px 1px rgba(0, 0, 0, 0.04);
  /* 弹簧曲线：滑过去时有一点点回弹 */
  transition: transform 450ms var(--ease-spring);
}
.seg-item {
  position: relative;
  flex: 1;
  padding: 8px 0;
  text-align: center;
  transition: transform 200ms var(--ease-out);
}
.seg-pressed { transform: scale(0.96); }
.seg-label { font-size: 15px; font-weight: 500; }
.seg-sub { margin-top: 1px; font-size: 11px; color: var(--secondary); }
.seg-on .seg-label { font-weight: 600; }
.seg-label-single { padding: 3px 0; }

/* 进场动画：淡入 + 上移，配合 animation-delay 做逐个出现 */
.fade-up {
  animation: fadeUp 600ms var(--ease-out) backwards;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 骨架屏闪光 */
.skeleton {
  border-radius: 12px;
  background: linear-gradient(90deg, var(--fill) 0%, var(--card) 50%, var(--fill) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer {
  from { background-position: 100% 0; }
  to { background-position: -100% 0; }
}

/* 加载转圈 */
.spinner {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-right-color: transparent;
  animation: spin 700ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.sk { height: 100px; margin: 16px 16px 0; }
.sk-tall { height: 200px; }

/* picker 包了一层，原来的 .row + .row 分隔线选不到，这里手动加 */
.row-sep { border-top: 0.5px solid var(--separator); }
.col { flex-direction: column; align-items: stretch; }

/* 切换列表时，旧内容先变淡，新数据回来再恢复 */
.dim { opacity: 0.4; transition: opacity 200ms var(--ease-out); }

.scope { margin-top: 12px; }

/* ========== 收入卡片 ========== */
.income {
  margin: 12px 16px 0;
  padding: 16px 18px 14px;
  border-radius: 12px;
  background: var(--card);
  transition: opacity 200ms var(--ease-out);
}
.income-top { display: flex; align-items: baseline; justify-content: space-between; }
.income-label { font-size: 14px; font-weight: 600; }
.income-date { font-size: 12px; color: var(--secondary); }
.income-total {
  margin-top: 6px;
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1.05;
  font-variant-numeric: tabular-nums;
}
.income-break { margin-top: 3px; font-size: 13px; color: var(--secondary); font-variant-numeric: tabular-nums; }
.income-split {
  display: flex;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 0.5px solid var(--separator);
}
.split { flex: 1; }
.split + .split { padding-left: 18px; border-left: 0.5px solid var(--separator); }
.split-label { display: flex; align-items: center; font-size: 12px; color: var(--secondary); }
.split-num { margin-top: 2px; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }

/* ========== 统计卡片 ========== */
.stats {
  display: flex;
  margin: 8px 16px 0;
  padding: 14px 0;
  border-radius: 12px;
  background: var(--card);
  transition: opacity 200ms var(--ease-out);
}
.stat { flex: 1; text-align: center; }
.stat + .stat { border-left: 0.5px solid var(--separator); }
.stat-num {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
  font-variant-numeric: tabular-nums;
}
.stat-label {
  margin-top: 2px;
  font-size: 12px;
  color: var(--secondary);
  display: flex;
  align-items: center;
  justify-content: center;
}
.dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-right: 4px;
  border-radius: 50%;
}
.dot-cash { background: var(--success); }
.dot-zelle { background: #8b5cf6; }

/* ========== 日期分组 ========== */
.day { color: var(--label); font-size: 15px; font-weight: 600; }
.day-meta { font-size: 11px; color: var(--secondary); }
.day-sum { color: var(--label); font-weight: 600; }

/* ========== 客户行 ========== */
.customer + .customer { border-top: 0.5px solid var(--separator); }
.when { width: 60px; flex-shrink: 0; }
.time {
  font-size: 17px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.end {
  font-size: 11px;
  color: var(--secondary);
  font-variant-numeric: tabular-nums;
}
.who {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  transition: opacity 200ms var(--ease-out);
}
.who-pressed { opacity: 0.5; }
.name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 16px;
}
.pay {
  flex-shrink: 0;
  margin-left: 7px;
  padding: 2px 7px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 500;
  background: var(--fill);
  color: var(--secondary);
}
.pay-cash { background: rgba(52, 199, 89, 0.14); color: #1f9d48; }
.pay-zelle { background: rgba(139, 92, 246, 0.14); color: #7c4dff; }
@media (prefers-color-scheme: dark) {
  .pay-cash { color: #4ade80; }
  .pay-zelle { color: #a78bfa; }
}

/* 金额列：总价（含小费），下面是小费或“+ 小费” */
.amount {
  flex-shrink: 0;
  min-width: 56px;
  margin-left: 6px;
  padding: 3px 4px;
  border-radius: 6px;
  text-align: right;
  transition: transform 200ms var(--ease-out), background-color 200ms var(--ease-out);
}
.amount-pressed { transform: scale(0.94); background: var(--fill); }
.amount-num { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.amount-tip { font-size: 11px; color: var(--success); font-variant-numeric: tabular-nums; }
.amount-add { font-size: 11px; color: var(--link); }

.del {
  flex-shrink: 0;
  margin-left: 8px;
  padding: 5px 12px;
  border-radius: 499.5px;
  background: rgba(255, 59, 48, 0.12);
  color: var(--danger);
  font-size: 13px;
  font-weight: 500;
  transition: transform 200ms var(--ease-out);
}
.del-pressed { transform: scale(0.92); }

/* ========== 设置 ========== */
.row-label { flex: 1; }
.row-value { color: var(--secondary); }
.chevron {
  width: 7px;
  height: 7px;
  margin-left: 8px;
  border-top: 2px solid var(--tertiary);
  border-right: 2px solid var(--tertiary);
  transform: rotate(45deg);
}
.footnote {
  margin: 7px 24px 0;
  font-size: 12px;
  color: var(--secondary);
  line-height: 1.5;
}

/* ========== 其它 ========== */
.hint { font-size: 14px; color: var(--secondary); line-height: 1.5; }
.openid {
  margin-top: 10px;
  padding: 10px;
  border-radius: 8px;
  background: var(--fill);
  font-family: Menlo, monospace;
  font-size: 12px;
  word-break: break-all;
}
.link { color: var(--link); }

.empty {
  margin: 12px 16px 0;
  padding: 32px 0;
  border-radius: 12px;
  background: var(--card);
  text-align: center;
}
.empty-title { font-size: 16px; font-weight: 600; }
.empty-sub { margin-top: 4px; font-size: 13px; color: var(--secondary); }


body { margin: 0; } * { box-sizing: border-box; } input { border: 0; background: none; outline: none; font: inherit; }
.nav, .cta { box-sizing: content-box; }
.toast { position: fixed; left: 50%; top: 45%; z-index: 200; padding: 12px 20px; border-radius: 12px; background: rgba(0,0,0,.75); color: #fff; font-size: 15px;
  transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none; transition: opacity 200ms, transform 300ms cubic-bezier(0.34,1.56,0.64,1); }
.toast-show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.alert-root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0); transition: background 250ms; }
.alert-open { background: rgba(0,0,0,.35); }
.alert { width: 270px; border-radius: 14px; overflow: hidden; text-align: center;
  background: rgba(242,242,247,.92); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  transform: scale(1.15); opacity: 0; transition: transform 300ms cubic-bezier(0.2,0.8,0.2,1), opacity 200ms; }
.alert-open .alert { transform: scale(1); opacity: 1; }
.alert-body { padding: 20px 16px 18px; }
.alert-title { font-size: 17px; font-weight: 600; }
.alert-content { margin-top: 4px; font-size: 13px; line-height: 1.4; }
.alert-actions { display: flex; border-top: .5px solid rgba(60,60,67,.29); }
.alert-btn { flex: 1; padding: 11px 0; font-size: 17px; color: #007aff; cursor: pointer; }
.alert-btn + .alert-btn { border-left: .5px solid rgba(60,60,67,.29); }
.alert-btn:active { background: rgba(0,0,0,.06); }
.alert-danger { color: #ff3b30; font-weight: 600; }
.alert-ok { font-weight: 600; }
.alert-input { width: 100%; margin-top: 12px; padding: 7px 8px; border-radius: 8px; background: #fff; border: .5px solid rgba(60,60,67,.29); font-size: 15px; text-align: left; }
/* 模拟 wx.showActionSheet（iOS 底部菜单） */
.as-root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300; }
.as-mask { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0); transition: background 300ms; }
.as-open .as-mask { background: rgba(0,0,0,.4); }
.as-sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; transform: translateY(110%); transition: transform 400ms cubic-bezier(0.32,0.72,0,1); }
.as-open .as-sheet { transform: none; }
.as-group { border-radius: 14px; overflow: hidden; background: rgba(242,242,247,.92); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
.as-group + .as-group { margin-top: 8px; background: #fff; }
.as-title { padding: 14px 16px; text-align: center; font-size: 13px; color: #8e8e93; }
.as-btn { height: 57px; line-height: 57px; text-align: center; font-size: 20px; color: #007aff; border-top: .5px solid rgba(60,60,67,.29); cursor: pointer; }
.as-btn:active { background: rgba(0,0,0,.06); }
.as-cancel { border-top: 0; font-weight: 600; }
.as-danger { color: #ff3b30; }
/* 模拟微信原生滚轮选择器（picker） */
.wheel-root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300; }
.wheel-mask { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0); transition: background 300ms; }
.wheel-open .wheel-mask { background: rgba(0,0,0,.4); }
.wheel-sheet { position: absolute; left: 0; right: 0; bottom: 0; padding-bottom: 24px; border-radius: 14px 14px 0 0; background: var(--card);
  transform: translateY(100%); transition: transform 450ms cubic-bezier(0.32,0.72,0,1); }
.wheel-open .wheel-sheet { transform: none; }
.wheel-bar { display: flex; justify-content: space-between; align-items: center; height: 52px; padding: 0 20px; border-bottom: .5px solid var(--separator); font-size: 17px; }
.wheel-title { font-weight: 600; }
.wheel-cancel { color: var(--secondary); cursor: pointer; }
.wheel-ok { color: var(--link); font-weight: 600; cursor: pointer; }
.wheel-cols { position: relative; display: flex; justify-content: center; gap: 8px; padding: 0 24px; }
.wheel-band { position: absolute; left: 16px; right: 16px; top: 50%; height: 40px; margin-top: -20px; border-radius: 10px; background: var(--fill); pointer-events: none; }
.wheel-col { position: relative; flex: 1; max-width: 160px; height: 220px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none;
  -webkit-mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); }
.wheel-col::-webkit-scrollbar { display: none; }
.wheel-pad { height: 90px; }
.wheel-item { height: 40px; line-height: 40px; text-align: center; font-size: 21px; scroll-snap-align: center; color: var(--label);
  font-variant-numeric: tabular-nums; cursor: pointer; transition: opacity 150ms; opacity: .35; }
.wheel-item.on { opacity: 1; font-weight: 500; }
.wheel-sep { align-self: center; font-size: 21px; font-weight: 600; z-index: 1; }
/* 模拟微信原生导航栏（店主页用） */
.native-nav { position: sticky; top: 0; z-index: 50; height: 44px; padding-top: 47px; box-sizing: content-box; display: flex; align-items: center; justify-content: center;
  background: var(--bg); font-size: 17px; font-weight: 600; }
.native-back { position: absolute; left: 12px; bottom: 0; height: 44px; display: flex; align-items: center; color: var(--label); text-decoration: none; font-size: 28px; font-weight: 300; }
@media (prefers-color-scheme: dark) {
  .alert { background: rgba(44,44,46,.92); color: #fff; }
  .alert-actions, .alert-btn + .alert-btn { border-color: rgba(84,84,88,.6); }
  .alert-btn { color: #0a84ff; } .alert-danger { color: #ff453a; }
  .alert-input { background: #1c1c1e; color: #fff; border-color: rgba(84,84,88,.6); }
  .as-group { background: rgba(44,44,46,.92); } .as-group + .as-group { background: #2c2c2e; }
  .as-btn { color: #0a84ff; border-color: rgba(84,84,88,.6); } .as-danger { color: #ff453a; }
}
/* 网页版专用样式（小程序的样式由 build.py 从 WXSS 转换过来，这里只补网页才需要的部分） */
html { -webkit-text-size-adjust: 100%; }
body { max-width: 560px; margin: 0 auto; min-height: 100vh; }
a { -webkit-tap-highlight-color: transparent; }
.row, .seg-item, .slot, .btn-primary, .ticket-btn, .amount, .del, .footer-link { cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; }

/* 顶部导航栏：网页没有系统状态栏，只留出刘海屏的安全区 */
.nav { height: 44px; padding-top: env(safe-area-inset-top); max-width: 560px; margin: 0 auto; }
.web-page { padding-top: calc(44px + env(safe-area-inset-top)); }
.native-nav { padding-top: env(safe-area-inset-top); }

.footer { display: flex; flex-direction: column; align-items: center; }
.footer-link { color: var(--link); }
.footer-link + .footer-link { margin-top: 0; color: var(--tertiary); }

/* 店主后台：客户名下面一行手机号（点了直接拨打） */
.who-col { min-width: 0; }
.who-line { display: flex; align-items: center; min-width: 0; }
.who-phone { margin-top: 2px; font-size: 12px; color: var(--secondary); font-variant-numeric: tabular-nums; }
.login-btn { margin: 24px 16px 0; }
.logout { margin-top: 12px; color: var(--danger); }

/* 店主后台：点客人时间可以改时间（虚线下划线提示可点） */
.when-edit .time { text-decoration: underline dotted var(--tertiary); text-underline-offset: 4px; }
.when { border-radius: 8px; transition: background-color 200ms; }
.when-pressed { background: var(--fill); }
.tag-closed { padding: 2px 8px; border-radius: 6px; background: rgba(255, 59, 48, .12); color: var(--danger); font-size: 13px; font-weight: 600; }

/* 底部菜单：选项多时可以滚动；灰掉的选项 */
.as-sheet .as-group:first-child { max-height: 64vh; overflow-y: auto; }
.as-muted { color: var(--tertiary) !important; }

/* 多选清单（每周营业日） */
.check-list { padding: 4px 0 8px; }
.check-row { display: flex; justify-content: space-between; align-items: center; height: 50px; padding: 0 24px; font-size: 17px; border-bottom: .5px solid var(--separator); cursor: pointer; }
.check-mark { color: var(--link); font-weight: 700; opacity: 0; }
.check-on .check-mark { opacity: 1; }

/* 顾客页：营业日多于 4 天时，日期改成可以横向滑动的小卡片 */
.date-chips { display: flex; gap: 8px; margin: 0 16px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.date-chips::-webkit-scrollbar { display: none; }
.date-chip { flex: 0 0 auto; min-width: 76px; padding: 8px 10px; border-radius: 12px; background: var(--fill); text-align: center; cursor: pointer; transition: background-color 200ms, transform 200ms; }
.date-chip.seg-on { background: var(--primary); color: var(--on-primary); }
.date-chip.seg-on .seg-sub { color: inherit; opacity: .7; }

/* 演示模式提示条 */
.demo-banner {
  position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 30;
  transform: translateX(-50%); padding: 6px 12px; border-radius: 999px;
  background: rgba(28, 37, 65, 0.85); color: #fff; font-size: 12px; white-space: nowrap; pointer-events: none;

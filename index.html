<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<link rel="icon" href="images/logo-icon.png">
<link rel="apple-touch-icon" href="images/logo-icon.png">
<title>Sam Barbershop · 在线预约</title>
<style>/* ========== 设计变量：参照 iOS 系统配色，自动适配深色模式 ========== */
body {
  --bg: #f2f2f7;
  --card: #ffffff;
  --label: #1c1c1e;
  --secondary: #8e8e93;
  --tertiary: #c7c7cc;
  --separator: rgba(60, 60, 67, 0.12);
  --fill: rgba(120, 120, 128, 0.12);
  --seg-on: #ffffff;
  --primary: #1c1c1e;
  --on-primary: #ffffff;
  --link: #007aff;
  --danger: #ff3b30;
  --success: #34c759;
  --nav-bg: rgba(242, 242, 247, 0.78);
  --shadow: 0 1px 3px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
  /* 品牌色：理发店转灯的红和蓝，只用在标志上 */
  --pole-red: #d0312d;
  --pole-blue: #2b59c3;

  /* Apple 常用的缓动曲线 */
  --ease-out: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  background: var(--bg);
  color: var(--label);
  font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body {
    --bg: #000000;
    --card: #1c1c1e;
    --label: #ffffff;
    --secondary: #8e8e93;
    --tertiary: #48484a;
    --separator: rgba(84, 84, 88, 0.6);
    --fill: rgba(120, 120, 128, 0.24);
    --seg-on: #636366;
    --primary: #f5f5f7;
    --on-primary: #000000;
    --link: #0a84ff;
    --danger: #ff453a;
    --success: #30d158;
    --nav-bg: rgba(0, 0, 0, 0.72);
    --shadow: none;
    --pole-red: #ff453a;
    --pole-blue: #409cff;
  } }
:root[data-theme="dark"] body {
    --bg: #000000;
    --card: #1c1c1e;
    --label: #ffffff;
    --secondary: #8e8e93;
    --tertiary: #48484a;
    --separator: rgba(84, 84, 88, 0.6);
    --fill: rgba(120, 120, 128, 0.24);
    --seg-on: #636366;
    --primary: #f5f5f7;
    --on-primary: #000000;
    --link: #0a84ff;
    --danger: #ff453a;
    --success: #30d158;
    --nav-bg: rgba(0, 0, 0, 0.72);
    --shadow: none;
    --pole-red: #ff453a;
    --pole-blue: #409cff;
  }

/* ========== 通用组件 ========== */

/* 分组列表（iOS 设置页那种圆角白卡片） */
.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 24px 24px 7px;
  font-size: 13px;
  color: var(--secondary);
  letter-spacing: 0.25px;
}
.group {
  margin: 0 16px;
  background: var(--card);
  border-radius: 12px;
  overflow: hidden;
}
.row {
  display: flex;
  align-items: center;
  min-height: 48px;
  padding: 10px 16px;
  transition: background-color 200ms var(--ease-out);
}
.row + .row { border-top: 0.5px solid var(--separator); }
.row-pressed { background: var(--fill); }

/* 主按钮：按下时轻微缩小，像 iOS 一样有“按下去”的手感 */
.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 50px;
  padding: 0 24px;
  border-radius: 499.5px;
  background: var(--primary);
  color: var(--on-primary);
  font-size: 16px;
  font-weight: 600;
  transition: transform 250ms var(--ease-out), opacity 250ms var(--ease-out);
}
.btn-pressed { transform: scale(0.96); opacity: 0.85; }
.btn-text {
  text-align: center;
  padding: 14px 0 4px;
  color: var(--link);
  font-size: 15px;
}

/* ========== 分段控件 ========== */
.segmented {
  position: relative;
  display: flex;
  margin: 0 16px;
  padding: 2px;
  border-radius: 11px;
  background: var(--fill);
}
.seg-indicator {
  position: absolute;
  top: 2px;
  bottom: 2px;
  left: 2px;
  border-radius: 9px;
  background: var(--seg-on);
  box-shadow: 0 3px 8px rgba(0, 0, 0, 0.1), 0 1px 1px rgba(0, 0, 0, 0.04);
  /* 弹簧曲线：滑过去时有一点点回弹 */
  transition: transform 450ms var(--ease-spring);
}
.seg-item {
  position: relative;
  flex: 1;
  padding: 8px 0;
  text-align: center;
  transition: transform 200ms var(--ease-out);
}
.seg-pressed { transform: scale(0.96); }
.seg-label { font-size: 15px; font-weight: 500; }
.seg-sub { margin-top: 1px; font-size: 11px; color: var(--secondary); }
.seg-on .seg-label { font-weight: 600; }
.seg-label-single { padding: 3px 0; }

/* 进场动画：淡入 + 上移，配合 animation-delay 做逐个出现 */
.fade-up {
  animation: fadeUp 600ms var(--ease-out) backwards;
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 骨架屏闪光 */
.skeleton {
  border-radius: 12px;
  background: linear-gradient(90deg, var(--fill) 0%, var(--card) 50%, var(--fill) 100%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}
@keyframes shimmer {
  from { background-position: 100% 0; }
  to { background-position: -100% 0; }
}

/* 加载转圈 */
.spinner {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-right-color: transparent;
  animation: spin 700ms linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========== 导航栏 ========== */
.nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  box-sizing: content-box;
  border-bottom: 0.5px solid transparent;
  transition: background-color 300ms var(--ease-out), border-color 300ms var(--ease-out);
}
.nav-collapsed {
  background: var(--nav-bg);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom-color: var(--separator);
}
.nav-title {
  height: 100%;
  display: flex;
  align-items: center;
  font-size: 17px;
  font-weight: 600;
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 250ms var(--ease-out), transform 300ms var(--ease-out);
}
.nav-collapsed .nav-title { opacity: 1; transform: translateY(0); }

/* ========== 大标题 ========== */
.page { padding-bottom: 130px; }
.hero { padding: 6px 20px 4px; }
/* 品牌标志：Sam Barbershop 转灯外圈徽章（brand/export 里导出的图片，白底，深色模式下也保持白底圆形） */
.logo-badge {
  display: block;
  width: 120px;
  height: 120px;
  margin-bottom: 8px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
}
.large-title {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1.15;
}
.subtitle {
  margin-top: 4px;
  font-size: 15px;
  color: var(--secondary);
}

/* ========== 骨架屏 ========== */
.sk-card { height: 180px; margin: 16px; }
.sk-row { height: 60px; margin: 16px; }
.sk-grid { height: 140px; margin: 16px; }

/* ========== 我的预约卡券 ========== */
.ticket {
  margin: 16px 16px 0;
  padding: 18px 20px 14px;
  border-radius: 16px;
  color: #fff;
  background: linear-gradient(145deg, #3a3a3c 0%, #1c1c1e 60%, #0b0b0c 100%);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
  border: 0.5px solid rgba(255, 255, 255, 0.08);
}
.ticket-top { display: flex; align-items: center; justify-content: space-between; }
.ticket-brand {
  display: flex;
  align-items: center;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.75);
}
.ticket-logo {
  width: 22px;
  height: 22px;
  margin-right: 7px;
  border-radius: 50%;
  flex-shrink: 0;
}
.badge {
  padding: 3px 9px;
  border-radius: 499.5px;
  background: rgba(52, 199, 89, 0.2);
  color: #4ade80;
  font-size: 11px;
  font-weight: 600;
}
.ticket-date { margin-top: 16px; font-size: 13px; color: rgba(255, 255, 255, 0.6); }
.ticket-time {
  margin-top: 4px;
  font-size: 48px;
  font-weight: 700;
  letter-spacing: -1px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
.ticket-end { font-size: 20px; font-weight: 500; color: rgba(255, 255, 255, 0.5); letter-spacing: 0; }
.ticket-name { margin-top: 6px; font-size: 14px; color: rgba(255, 255, 255, 0.7); }
/* 虚线两端挖出半圆缺口，像一张真的票 */
.ticket-divider {
  position: relative;
  margin: 16px -20px;
  border-top: 1px dashed rgba(255, 255, 255, 0.14);
}
.ticket-divider::before,
.ticket-divider::after {
  content: '';
  position: absolute;
  top: -9px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--bg);
}
.ticket-divider::before { left: -9px; }
.ticket-divider::after { right: -9px; }
.ticket-addr { font-size: 14px; }
.ticket-door { margin-top: 2px; font-size: 14px; color: rgba(255, 255, 255, 0.6); }
.ticket-actions { display: flex; gap: 8px; margin-top: 14px; }
.ticket-btn {
  flex: 1;
  text-align: center;
  padding: 9px 0;
  border-radius: 499.5px;
  background: rgba(255, 255, 255, 0.12);
  font-size: 13px;
  font-weight: 500;
  transition: transform 200ms var(--ease-out), background-color 200ms var(--ease-out);
}
.ticket-btn-danger { color: #ff6961; }
.ticket-btn-pressed { transform: scale(0.96); background: rgba(255, 255, 255, 0.2); }

/* ========== 地址行 ========== */
.icon {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  margin-right: 12px;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.icon-red { background: var(--danger); }
.icon-wechat { background: #07c160; }
.icon-green { background: var(--success); }
/* 下面三个图标都是用 CSS 画的，不需要图片 */
.pin-dot {
  width: 11px;
  height: 11px;
  border: 2.5px solid #fff;
  border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg) translate(1px, -1px);
}
.bubble {
  position: relative;
  width: 15px;
  height: 12px;
  border-radius: 50%;
  background: #fff;
}
.bubble::after {
  content: '';
  position: absolute;
  left: 2px;
  bottom: -2px;
  border: 2.5px solid transparent;
  border-top-color: #fff;
  border-left-color: #fff;
}
/* 电话听筒：两端圆头 + 中间弧形 */
.handset {
  position: relative;
  width: 13px;
  height: 13px;
  border: 3px solid #fff;
  border-top-color: transparent;
  border-right-color: transparent;
  border-radius: 50%;
  transform: rotate(0deg) translate(1px, -1px);
}
.handset::before,
.handset::after {
  content: '';
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 1.5px;
  background: #fff;
}
.handset::before { left: -2px; top: -1px; }
.handset::after { right: -1px; bottom: -2px; }
.row-main { flex: 1; min-width: 0; }
.row-title { font-size: 15px; line-height: 1.35; }
.row-sub { margin-top: 2px; font-size: 13px; color: var(--secondary); }
.row-accessory { margin-left: 8px; font-size: 14px; color: var(--link); }

/* ========== 输入框 ========== */
.field { flex: 1; height: 28px; font-size: 16px; color: var(--label); }
.placeholder { color: var(--tertiary); }


/* 选 Zelle 时展开收款账号：用 max-height + 透明度做展开收起 */
.zelle {
  max-height: 0;
  opacity: 0;
  overflow: hidden;
  transform: translateY(-6px);
  transition: max-height 450ms var(--ease-sheet), opacity 300ms var(--ease-out), transform 450ms var(--ease-sheet);
}
.zelle-show { max-height: 100px; opacity: 1; transform: none; }
.zelle-inner { margin-top: 8px; }

/* ========== 时间格子 ========== */
.section-note { font-size: 12px; color: var(--secondary); }
.period {
  margin: 4px 24px 7px;
  font-size: 12px;
  font-weight: 600;
  color: var(--secondary);
}
.slots {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin: 0 16px 14px;
}
.slot {
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: var(--card);
  font-size: 16px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  transition:
    transform 350ms var(--ease-spring),
    background-color 250ms var(--ease-out),
    color 250ms var(--ease-out);
}
/* backwards：只在动画开始前生效，结束后不锁住 transform，按下/选中的缩放才能生效 */
.slot-in { animation: slotIn 500ms var(--ease-out) backwards; }
@keyframes slotIn {
  from { opacity: 0; transform: translateY(8px) scale(0.96); }
  to { opacity: 1; transform: none; }
}
.slot-pressed { transform: scale(0.94); }
.slot-on {
  background: var(--primary);
  color: var(--on-primary);
  transform: scale(1.04);
}
.slot-taken {
  background: transparent;
  color: var(--tertiary);
  text-decoration: line-through;
}

.empty {
  margin: 0 16px;
  padding: 28px 0;
  border-radius: 12px;
  background: var(--card);
  text-align: center;
}
.empty-title { font-size: 16px; font-weight: 600; }
.empty-sub { margin-top: 4px; font-size: 13px; color: var(--secondary); }

.footer {
  margin-top: 28px;
  text-align: center;
  font-size: 12px;
}
.footer-brand { color: var(--secondary); }
.footer-link {
  display: inline-block;
  margin-top: 4px;
  padding: 6px 12px;
  color: var(--tertiary);
}

/* ========== 底部操作栏 ========== */
.cta {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  z-index: 40;
  display: flex;
  align-items: center;
  padding: 8px 8px 8px 18px;
  border-radius: 499.5px;
  background: var(--nav-bg);
  backdrop-filter: saturate(180%) blur(24px);
  -webkit-backdrop-filter: saturate(180%) blur(24px);
  border: 0.5px solid var(--separator);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
  transform: translateY(200%);
  opacity: 0;
  transition: transform 550ms var(--ease-spring), opacity 300ms var(--ease-out);
}
.cta-show { transform: translateY(0); opacity: 1; }
.cta-info { flex: 1; }
.cta-label { font-size: 11px; color: var(--secondary); }
.cta-value { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cta .btn-primary { height: 44px; }

/* ========== 底部弹层 ========== */
.sheet-root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; }
.mask {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.4);
  opacity: 0;
  transition: opacity 400ms var(--ease-out);
}
.sheet {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 8px 20px calc(16px + env(safe-area-inset-bottom));
  border-radius: 20px 20px 0 0;
  background: var(--card);
  transform: translateY(100%);
  /* iOS 系统 Sheet 用的就是这条曲线：起步快、收尾很柔 */
  transition: transform 500ms var(--ease-sheet);
}
.sheet-open .mask { opacity: 1; }
.sheet-open .sheet { transform: translateY(0); }
.grabber {
  width: 36px;
  height: 5px;
  margin: 0 auto 14px;
  border-radius: 499.5px;
  background: var(--tertiary);
}
.sheet-title { font-size: 20px; font-weight: 700; margin-bottom: 12px; }
.summary {
  border-radius: 12px;
  background: var(--bg);
  padding: 0 14px;
}
.summary-row {
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
  font-size: 15px;
}
.summary-row + .summary-row { border-top: 0.5px solid var(--separator); }
.summary-k { color: var(--secondary); flex-shrink: 0; margin-right: 16px; }
.summary-v { text-align: right; font-weight: 500; }
.sheet-btn { margin-top: 20px; }

/* 成功：圆圈弹出 + 对勾画出 */
.success { padding: 12px 0 4px; text-align: center; }
.check-circle {
  width: 64px;
  height: 64px;
  margin: 4px auto 14px;
  border-radius: 50%;
  background: var(--success);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: pop 600ms var(--ease-spring) both;
}
.check {
  width: 13px;
  height: 26px;
  margin-top: -5px;
  border-right: 4.5px solid #fff;
  border-bottom: 4.5px solid #fff;
  border-radius: 1px;
  transform: rotate(45deg);
  animation: draw 400ms var(--ease-out) 250ms both;
}
@keyframes pop {
  from { transform: scale(0.3); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
@keyframes draw {
  from { opacity: 0; transform: rotate(45deg) scale(0.4); }
  to { opacity: 1; transform: rotate(45deg) scale(1); }
}
.success-title { font-size: 22px; font-weight: 700; animation: fadeUp 500ms var(--ease-out) 200ms both; }
.success-sub {
  margin: 4px 0 16px;
  font-size: 15px;
  color: var(--secondary);
  animation: fadeUp 500ms var(--ease-out) 260ms both;
}
.success-summary { animation: fadeUp 500ms var(--ease-out) 320ms both; }


body { margin: 0; } * { box-sizing: border-box; } input { border: 0; background: none; outline: none; font: inherit; }
.nav, .cta { box-sizing: content-box; }
.toast { position: fixed; left: 50%; top: 45%; z-index: 200; padding: 12px 20px; border-radius: 12px; background: rgba(0,0,0,.75); color: #fff; font-size: 15px;
  transform: translate(-50%, -50%) scale(.9); opacity: 0; pointer-events: none; transition: opacity 200ms, transform 300ms cubic-bezier(0.34,1.56,0.64,1); }
.toast-show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.alert-root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0); transition: background 250ms; }
.alert-open { background: rgba(0,0,0,.35); }
.alert { width: 270px; border-radius: 14px; overflow: hidden; text-align: center;
  background: rgba(242,242,247,.92); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  transform: scale(1.15); opacity: 0; transition: transform 300ms cubic-bezier(0.2,0.8,0.2,1), opacity 200ms; }
.alert-open .alert { transform: scale(1); opacity: 1; }
.alert-body { padding: 20px 16px 18px; }
.alert-title { font-size: 17px; font-weight: 600; }
.alert-content { margin-top: 4px; font-size: 13px; line-height: 1.4; }
.alert-actions { display: flex; border-top: .5px solid rgba(60,60,67,.29); }
.alert-btn { flex: 1; padding: 11px 0; font-size: 17px; color: #007aff; cursor: pointer; }
.alert-btn + .alert-btn { border-left: .5px solid rgba(60,60,67,.29); }
.alert-btn:active { background: rgba(0,0,0,.06); }
.alert-danger { color: #ff3b30; font-weight: 600; }
.alert-ok { font-weight: 600; }
.alert-input { width: 100%; margin-top: 12px; padding: 7px 8px; border-radius: 8px; background: #fff; border: .5px solid rgba(60,60,67,.29); font-size: 15px; text-align: left; }
/* 模拟 wx.showActionSheet（iOS 底部菜单） */
.as-root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 300; }
.as-mask { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0); transition: background 300ms; }
.as-open .as-mask { background: rgba(0,0,0,.4); }
.as-sheet { position: absolute; left: 8px; right: 8px; bottom: 8px; transform: translateY(110%); transition: transform 400ms cubic-bezier(0.32,0.72,0,1); }
.as-open .as-sheet { transform: none; }
.as-group { border-radius: 14px; overflow: hidden; background: rgba(242,242,247,.92); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
.as-group + .as-group { margin-top: 8px; background: #fff; }
.as-title { padding: 14px 16px; text-align: center; font-size: 13px; color: #8e8e93; }
.as-btn { height: 57px; line-height: 57px; text-align: center; font-size: 20px; color: #007aff; border-top: .5px solid rgba(60,60,67,.29); cursor: pointer; }
